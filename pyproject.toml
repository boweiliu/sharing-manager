[project]
name = "sharing-manager"
version = "0.1.0"
description = "Manage workspace and app sharing permissions, links, and visiting agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pydantic>=2.0",
    "tomlkit>=0.12",
    "werkzeug>=3.0",
]

[project.scripts]
sharing-manager = "sharing_manager.runner:main"

[project.optional-dependencies]
test = ["pytest>=8", "playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharing_manager"]

[tool.pytest.ini_options]
markers = ["browser: exercises the app in a real browser"]
pythonpath = ["src"]
