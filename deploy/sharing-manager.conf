[program:sharing-manager]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --manifest .external_worktrees/sharing-manager/app.toml --url http://localhost:8082 && PYTHONPATH=.external_worktrees/sharing-manager/src exec /home/user/workspace/.venv/bin/python -m sharing_manager.runner"
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/sharing-manager-stdout.log
stderr_logfile=/var/log/supervisor/sharing-manager-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
